[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmi-frie-data"
version = "0.1.0"
description = "Python client library for DMI Frie Data open APIs"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Sebastian Winkelmann" }
]
dependencies = [
  "httpx>=0.28",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
